      required:
      - postType
      - title
      - description
      - categoryId
      - province
      description: 'Thiết kế đề xuất: multipart để đảm bảo tạo SELL kèm ảnh nguyên tử. SELL: price,condition,images
        bắt buộc; BUY_REQUEST: budgetMin,budgetMax bắt buộc; kiểm tra điều kiện ở backend.'
      additionalProperties: false
    PatchPostBody:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
