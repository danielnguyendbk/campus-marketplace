openapi: 3.0.3
info:
  title: Campus Marketplace API
  version: 1.2.0-draft
  description: 'API Contract để import vào Apidog và thống nhất giữa Frontend/Backend. Cơ sở: DBML Campus Marketplace
    v1.2 (18 bảng) và hồ sơ nghiệp vụ v1.2. Đây là THIẾT KẾ, không phải backend đang chạy. Những endpoint ghi
    x-source=Proposed extension cần nhóm phê duyệt. Bảo mật: không công bố password_hash, otp.code_hash, card_image_ref,
    storage_key; các URL file là short-lived/signed. Role và verificationStatus được backend enforce, không
    chỉ ẩn giao diện. REST API không mô tả đầy đủ WebSocket: kênh /ws, event message.created và notification.created
    phải được đặc tả riêng. Tất cả trường JSON dạng camelCase; DBML lưu snake_case. API sử dụng /api/v1 prefix.
    Đơn vị giá: VND; cân nhắc chuyển sang integer nếu hệ thống quyết định giá chỉ là số nguyên.'
servers:
- url: http://localhost:3000/api/v1
  description: Local backend (chưa triển khai)
tags:
- name: Authentication
  description: OTP email trường và đăng ký/đăng nhập
- name: Profile
  description: Hồ sơ người dùng
- name: Verification
  description: Minh chứng sinh viên
- name: Admin Verification
  description: Duyệt hồ sơ riêng tư
- name: Preferences
  description: Sở thích feed
- name: Categories
  description: Danh mục
- name: Posts & Search
  description: Đăng tin và tìm kiếm
- name: Post Lifecycle
  description: Trạng thái tin
- name: Feed & Matching
  description: Feed giới hạn và matching rule-based
- name: Contact
  description: Xem số điện thoại có audit
- name: Conversations & Chat
  description: Chat và tệp đính kèm
- name: Reports & Reputation
  description: Báo cáo buyer và phản hồi seller
- name: Admin Reports
  description: Admin quản lý report
- name: Admin Users & Audit
  description: Quản trị, cấu hình và audit
- name: Notifications
  description: Thông báo
security:
- BearerAuth: []
paths:
  /auth/request-otp:
    post:
      tags:
      - Authentication
      summary: Gửi OTP email trường
      operationId: requestOtp
      description: Chỉ domain allowlist, không tiết lộ trạng thái email tồn tại; rate limit; OTP lưu hash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOtpBody'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageResponse'
              example:
                data:
                  success: true
                  message: Nếu email hợp lệ, hướng dẫn xác minh sẽ được gửi.
        '400':
          description: Dữ liệu đầu vào không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Yêu cầu quá nhiều / giới hạn OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
      x-source: v1.2 §9.2
  /auth/verify-otp:
    post:
      tags:
      - Authentication
      summary: Xác thực OTP
      operationId: verifyOtp
      description: OTP đúng mới trả otpTicket ngắn hạn; không trả codeHash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpBody'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOtpResponse'
              example:
                data:
                  otpTicket: otp_ticket_example_only
                  expiresIn: 600
        '400':
          description: Dữ liệu đầu vào không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Trạng thái xung đột hoặc trùng lặp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Yêu cầu quá nhiều / giới hạn OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
      x-source: v1.2 §9.2
  /auth/register:
    post:
      tags:
      - Authentication
      summary: Đăng ký sau OTP
      operationId: register
      description: Chỉ chấp nhận otpTicket valid/chưa dùng. Account tạo PENDING; schoolEmail lấy từ ticket.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBody'
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
              example:
                data:
                  accessToken: mock-access-token-not-real
                  tokenType: Bearer
                  expiresIn: 3600
                  user:
                    id: 0d8d830e-11bd-440a-b72e-24c8bd3a519a
                    displayName: Sinh viên A
                    role: USER
                    verificationStatus: PENDING
        '400':
          description: Dữ liệu đầu vào không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Trạng thái xung đột hoặc trùng lặp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Không thỏa quy tắc nghiệp vụ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
      x-source: v1.2 §9.2
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Đăng nhập
      operationId: login
      description: PENDING và REJECTED vẫn có thể đăng nhập để xem hồ sơ; SUSPENDED bị chặn theo chính sách.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
              example:
                data:
                  accessToken: mock-access-token-not-real
                  tokenType: Bearer
                  expiresIn: 3600
                  user:
                    id: 0d8d830e-11bd-440a-b72e-24c8bd3a519a
                    displayName: Sinh viên A
                    role: USER
                    verificationStatus: APPROVED
        '400':
          description: Dữ liệu đầu vào không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Chưa đăng nhập hoặc token không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Không đủ quyền hoặc tài khoản chưa APPROVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Yêu cầu quá nhiều / giới hạn OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
      x-source: v1.2 §9.2
  /me:
    get:
      tags:
      - Profile
      summary: Lấy hồ sơ của tôi
      operationId: getMyProfile
      description: Không trả cardImageRef, passwordHash, codeHash; PENDING/REJECTED được xem.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              example:
                data:
                  id: 0d8d830e-11bd-440a-b72e-24c8bd3a519a
                  schoolEmail: student@example.edu.vn
                  displayName: Sinh viên A
                  role: USER
                  verificationStatus: APPROVED
                  reputationScore: 5.0
                  createdAt: '2026-11-01T09:00:00Z'
        '401':
          description: Chưa đăng nhập hoặc token không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-source: v1.2 §9.2
      x-required-role: AUTHENTICATED (xem thêm quy tắc APPROVED/PENDING)
    patch:
      tags:
      - Profile
      summary: Cập nhật thông tin liên hệ
      operationId: patchMyProfile
      description: Không sửa email trường, role, reputation, trạng thái xét duyệt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          description: Dữ liệu đầu vào không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Chưa đăng nhập hoặc token không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Không đủ quyền hoặc tài khoản chưa APPROVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-source: Proposed extension (UI hồ sơ)
      x-required-role: AUTHENTICATED (xem thêm quy tắc APPROVED/PENDING)
  /me/evidence:
    post:
      tags:
      - Verification
      summary: Nộp/nộp lại minh chứng sinh viên
      operationId: submitEvidence
      description: PENDING hoặc REJECTED; multipart, ảnh thẻ private. Nộp lại REJECTED chuyển PENDING.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EvidenceSubmission'
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponse'
        '400':
          description: Dữ liệu đầu vào không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Chưa đăng nhập hoặc token không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Không đủ quyền hoặc tài khoản chưa APPROVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Tệp vượt giới hạn 10 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: Định dạng tệp không được hỗ trợ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-source: v1.2 §9.2
      x-required-role: AUTHENTICATED (xem thêm quy tắc APPROVED/PENDING)
  /me/verification:
    get:
      tags:
      - Verification
      summary: Xem trạng thái xét duyệt
      operationId: getMyVerification
      description: Chỉ thông tin trạng thái/lý do; không trả URL minh chứng.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponse'
              example:
                data:
                  status: PENDING
                  submittedAt: '2026-11-01T09:00:00Z'
        '401':
          description: Chưa đăng nhập hoặc token không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-source: v1.2 §9.2
      x-required-role: AUTHENTICATED (xem thêm quy tắc APPROVED/PENDING)
  /admin/verifications:
    get:
      tags:
      - Admin Verification
      summary: Danh sách hồ sơ chờ xét duyệt
      operationId: listVerifications
      description: Chỉ ADMIN; có phân trang, lọc trạng thái.
      parameters:
      - &id002
        name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - &id003
        name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/VerificationStatus'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminVerification'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                required:
                - data
                - meta
        '401':
          description: Chưa đăng nhập hoặc token không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Không đủ quyền hoặc tài khoản chưa APPROVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-source: Proposed extension (UI-08 và v1.2 §9.2)
      x-required-role: ADMIN
  /admin/verifications/{verificationId}:
    get:
      tags:
      - Admin Verification
      summary: Xem hồ sơ và ảnh thẻ (Admin)
      operationId: getVerification
      description: Chỉ Admin; cardImageUrl là signed URL ngắn hạn; audit truy cập minh chứng.
      parameters:
      - &id001
        name: verificationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVerificationResponse'
        '401':
          description: Chưa đăng nhập hoặc token không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Không đủ quyền hoặc tài khoản chưa APPROVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Không tìm thấy tài nguyên được phép xem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-source: v1.2 §9.2
      x-required-role: ADMIN
    patch:
      tags:
      - Admin Verification
      summary: Duyệt/từ chối minh chứng
      operationId: reviewVerification
      description: REJECTED yêu cầu reason; APPROVED cấp quyền Marketplace. Ghi audit.
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewVerificationBody'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVerificationResponse'
        '400':
          description: Dữ liệu đầu vào không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Chưa đăng nhập hoặc token không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Không đủ quyền hoặc tài khoản chưa APPROVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Không tìm thấy tài nguyên được phép xem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Trạng thái xung đột hoặc trùng lặp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Không thỏa quy tắc nghiệp vụ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-source: v1.2 §9.2
      x-required-role: ADMIN
  /me/preferences:
    get:
      tags:
      - Preferences
      summary: Xem sở thích
      operationId: getPreferences
      description: APPROVED; categories và keywords dùng cho rule-based feed.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenceResponse'
              example:
                data:
                  favoriteCategoryIds:
                  - TEXTBOOK
                  interestKeywords:
                  - Java
                  updatedAt: '2026-11-01T09:00:00Z'
        '401':
          description: Chưa đăng nhập hoặc token không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Không đủ quyền hoặc tài khoản chưa APPROVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-source: v1.2 §9.2
      x-required-role: AUTHENTICATED (xem thêm quy tắc APPROVED/PENDING)
    patch:
      tags:
      - Preferences
      summary: Cập nhật sở thích
      operationId: setPreferences
      description: Chuẩn hóa từ khóa, khử trùng lặp và kiểm categoryIds đang active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferenceBody'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenceResponse'
        '400':
          description: Dữ liệu đầu vào không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Chưa đăng nhập hoặc token không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Không đủ quyền hoặc tài khoản chưa APPROVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Không thỏa quy tắc nghiệp vụ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-source: v1.2 §9.2
      x-required-role: AUTHENTICATED (xem thêm quy tắc APPROVED/PENDING)
  /categories:
    get:
      tags:
      - Categories
      summary: Danh mục sản phẩm đang hoạt động
      operationId: getCategories
      description: Cấu trúc lấy từ bảng categories; không cho public sửa danh mục.
      parameters: &id008
      - *id002
      - *id003
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
              example:
                data:
                - id: TEXTBOOK
                  name: Sách và giáo trình
                  slug: textbooks
                  sortOrder: 1
                meta: &id004
                  page: 1
                  limit: 20
                  total: 1
                  totalPages: 1
        '401':
          description: Chưa đăng nhập hoặc token không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Không đủ quyền hoặc tài khoản chưa APPROVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-source: Proposed extension (bảng categories / form tạo tin)
      x-required-role: AUTHENTICATED (xem thêm quy tắc APPROVED/PENDING)
  /posts:
    get:
      tags:
      - Posts & Search
      summary: Tìm kiếm và lọc tin ACTIVE
      operationId: searchPosts
      description: APPROVED only; không trả post của owner chưa APPROVED, không trả HIDDEN/SOLD/CLOSED; matchedReasons
        trả về khi có match.
      parameters:
      - *id002
      - *id003
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PostType'
      - name: categoryId
        in: query
        required: false
        schema:
          type: string
      - name: min
        in: query
        required: false
        schema:
          type: number
          minimum: 0
      - name: max
        in: query
        required: false
        schema:
          type: number
          minimum: 0
      - name: province
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPage'
              example:
                data:
                - &id009
                  id: a23ef463-1a6b-4b2d-a330-0e47edff0217
                  postType: SELL
                  title: Giáo trình Java còn mới
                  categoryId: TEXTBOOK
                  province: TP. Hồ Chí Minh
                  status: ACTIVE
                  price: 120000
                  thumbnailUrl: https://example.com/mock/post-images/java-book.jpg
                  createdAt: '2026-11-01T09:00:00Z'
                  matchedReasons:
                  - Phù hợp danh mục yêu thích
                meta: *id004
        '400':
          description: Dữ liệu đầu vào không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Chưa đăng nhập hoặc token không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Không đủ quyền hoặc tài khoản chưa APPROVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-source: v1.2 §9.2
      x-required-role: AUTHENTICATED (xem thêm quy tắc APPROVED/PENDING)
