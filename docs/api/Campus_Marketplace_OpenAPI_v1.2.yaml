components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token từ login/register, role/verification enforced ở backend.
  schemas:
    UserRole:
      type: string
      enum:
      - USER
      - ADMIN
    VerificationStatus:
      type: string
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      - SUSPENDED
    PostType:
      type: string
      enum:
      - SELL
      - BUY_REQUEST
    PostStatus:
      type: string
      enum:
      - ACTIVE
      - HIDDEN
      - SOLD
      - CLOSED
    ConversationStatus:
      type: string
      enum:
      - OPEN
      - ARCHIVED
    MessageType:
      type: string
      enum:
      - TEXT
      - ATTACHMENT
    AttachmentStatus:
      type: string
      enum:
      - ACTIVE
      - EXPIRED
      - DELETED
    ReportReasonCode:
      type: string
      enum:
      - STALE_SOLD_POST
      - MISLEADING_INFO
      - INAPPROPRIATE_CONTENT
      - OTHER
    ReportStatus:
      type: string
      enum:
      - SUBMITTED
      - WAITING_SELLER_RESPONSE
      - UNDER_REVIEW
      - RESOLVED
      - DISMISSED
      - NO_RESPONSE
    ReviewDecision:
      type: string
      enum:
      - APPROVED
      - REJECTED
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
                additionalProperties: false
              additional: false
          required:
          - code
          - message
          additionalProperties: false
        requestId:
          type: string
      required:
      - error
      description: Dạng lỗi đề xuất, FE/BE phải chốt trước khi triển khai.
      additionalProperties: false
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      required:
      - page
      - limit
      - total
      - totalPages
      additionalProperties: false
    SimpleMessage:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
      - success
      - message
      additionalProperties: false
    SimpleMessageResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SimpleMessage'
      required:
      - data
      additionalProperties: false
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'
        reputationScore:
          type: number
          minimum: 0
          maximum: 5
        province:
          type: string
      required:
      - id
      - displayName
      - verificationStatus
      description: Chỉ public fields; KHÔNG có schoolEmail, phoneNumber, cardImageRef, passwordHash.
      additionalProperties: false
    MeProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        schoolEmail:
          type: string
          format: email
        displayName:
          type: string
        phoneNumber:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/UserRole'
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'
        school:
          type: string
          nullable: true
        major:
          type: string
          nullable: true
        className:
          type: string
          nullable: true
        studentCode:
          type: string
          nullable: true
        cohort:
          type: string
          nullable: true
        province:
          type: string
          nullable: true
        reputationScore:
          type: number
          minimum: 0
          maximum: 5
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - schoolEmail
      - displayName
      - role
      - verificationStatus
      - createdAt
      description: Response riêng tư của chính chủ, không chứa passwordHash, cardImageRef.
      additionalProperties: false
    MeResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/MeProfile'
      required:
      - data
      additionalProperties: false
    UpdateMeRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 255
        phoneNumber:
          type: string
          nullable: true
          maxLength: 20
        province:
          type: string
          maxLength: 100
      description: Không cho sửa role, verificationStatus, reputationScore hoặc schoolEmail ở đây.
      additionalProperties: false
    AuthUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'
      required:
      - id
      - displayName
      - role
      - verificationStatus
      additionalProperties: false
    AuthSession:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          minimum: 1
        user:
          $ref: '#/components/schemas/AuthUser'
      required:
      - accessToken
      - tokenType
      - expiresIn
      - user
      additionalProperties: false
    AuthSessionResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuthSession'
      required:
      - data
      additionalProperties: false
    RequestOtpBody:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email thuộc domain trường trong ALLOWED_SCHOOL_DOMAINS.
      required:
      - email
      additionalProperties: false
    VerifyOtpBody:
      type: object
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          minLength: 4
          maxLength: 12
      required:
      - email
      - code
      additionalProperties: false
    VerifyOtpResult:
      type: object
      properties:
        otpTicket:
          type: string
          description: Token ngắn hạn dùng MỘT LẦN để đăng ký; không lưu OTP plaintext.
        expiresIn:
          type: integer
          minimum: 1
      required:
      - otpTicket
      - expiresIn
      additionalProperties: false
    VerifyOtpResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/VerifyOtpResult'
      required:
      - data
      additionalProperties: false
    RegisterBody:
      type: object
      properties:
        otpTicket:
          type: string
        displayName:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
      required:
      - otpTicket
      - displayName
      - password
      description: Email phải suy ra từ otpTicket đã verify; không tin client tự gán role/status.
      additionalProperties: false
    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
      - email
      - password
      additionalProperties: false
    VerificationState:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/VerificationStatus'
        reason:
          type: string
          nullable: true
        submittedAt:
          type: string
          format: date-time
      required:
      - status
      description: Trạng thái hiển thị cho chính chủ; không trả đường dẫn ảnh thẻ.
      additionalProperties: false
    VerificationResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/VerificationState'
      required:
      - data
      additionalProperties: false
    EvidenceSubmission:
      type: object
      properties:
        school:
          type: string
          maxLength: 255
        major:
          type: string
          maxLength: 255
        className:
          type: string
          maxLength: 100
        studentCode:
          type: string
          maxLength: 50
        cohort:
          type: string
          maxLength: 50
        province:
          type: string
          maxLength: 100
        cardImage:
          type: string
          format: binary
          description: Ảnh thẻ sinh viên; lưu private, chỉ Admin được xem.
      required:
      - school
      - studentCode
      - cardImage
      additionalProperties: false
    AdminVerification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/VerificationStatus'
        schoolEmail:
          type: string
          format: email
        displayName:
          type: string
        school:
          type: string
          nullable: true
        studentCode:
          type: string
          nullable: true
        cardImageUrl:
          type: string
          format: uri
          description: Signed URL tạm thời, CHỈ Admin nhận và không được cache công khai.
        submittedAt:
          type: string
          format: date-time
        reason:
          type: string
          nullable: true
        reviewedAt:
          type: string
          format: date-time
      required:
      - id
      - userId
      - status
      - schoolEmail
      - displayName
      - cardImageUrl
      - submittedAt
      additionalProperties: false
    AdminVerificationResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AdminVerification'
      required:
      - data
      additionalProperties: false
    ReviewVerificationBody:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/ReviewDecision'
        reason:
          type: string
          description: Bắt buộc khi REJECTED; phải ghi audit.
      required:
      - decision
      additionalProperties: false
    Preference:
      type: object
      properties:
        favoriteCategoryIds:
          type: array
          items:
            type: string
        interestKeywords:
          type: array
          items:
            type: string
        updatedAt:
          type: string
          format: date-time
      required:
      - favoriteCategoryIds
      - interestKeywords
      additionalProperties: false
    UpdatePreferenceBody:
      type: object
      properties:
        favoriteCategoryIds:
          type: array
          items:
            type: string
        interestKeywords:
          type: array
          items:
            type: string
      required:
      - favoriteCategoryIds
      - interestKeywords
      additionalProperties: false
    PreferenceResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Preference'
      required:
      - data
      additionalProperties: false
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        sortOrder:
          type: integer
      required:
      - id
      - name
      - slug
      additionalProperties: false
    CategoryPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        meta:
          $ref: '#/components/schemas/PageMeta'
      required:
      - data
      - meta
      additionalProperties: false
    SellDetail:
      type: object
      properties:
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
        condition:
          type: string
        allowPhoneReveal:
          type: boolean
      required:
      - price
      - condition
      - allowPhoneReveal
      additionalProperties: false
    BuyRequestDetail:
      type: object
      properties:
        budgetMin:
          type: number
          minimum: 0
        budgetMax:
          type: number
          minimum: 0
      required:
      - budgetMin
      - budgetMax
      additionalProperties: false
    PostImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          description: Delivery URL được cấp theo chính sách bảo vệ, không lộ storageKey.
        sortOrder:
          type: integer
      required:
      - id
      - url
      - sortOrder
      additionalProperties: false
    PostSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        postType:
          $ref: '#/components/schemas/PostType'
        title:
          type: string
        categoryId:
          type: string
        province:
          type: string
        status:
          $ref: '#/components/schemas/PostStatus'
        price:
          type: number
          nullable: true
        budgetMin:
          type: number
          nullable: true
        budgetMax:
          type: number
          nullable: true
        thumbnailUrl:
          type: string
          format: uri
          nullable: true
        createdAt:
          type: string
          format: date-time
        matchedReasons:
          type: array
          items:
            type: string
      required:
      - id
      - postType
      - title
      - categoryId
      - province
      - status
      - createdAt
      additionalProperties: false
    PostDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner:
          $ref: '#/components/schemas/UserSummary'
        postType:
          $ref: '#/components/schemas/PostType'
        title:
          type: string
        description:
          type: string
        categoryId:
          type: string
        province:
          type: string
        status:
          $ref: '#/components/schemas/PostStatus'
        sellDetail:
          $ref: '#/components/schemas/SellDetail'
        buyRequestDetail:
          $ref: '#/components/schemas/BuyRequestDetail'
        images:
          type: array
          items:
            $ref: '#/components/schemas/PostImage'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        closeReason:
          type: string
          nullable: true
      required:
      - id
      - owner
      - postType
      - title
      - description
      - categoryId
      - province
      - status
      - images
      - createdAt
      description: SELL có sellDetail, BUY_REQUEST có buyRequestDetail; không trả storageKey.
      additionalProperties: false
    PostResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PostDetail'
      required:
      - data
      additionalProperties: false
    PostPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PostSummary'
        meta:
          $ref: '#/components/schemas/PageMeta'
      required:
      - data
      - meta
      additionalProperties: false
    PendingFeedItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        postType:
          $ref: '#/components/schemas/PostType'
        thumbnailUrl:
          type: string
          format: uri
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - title
      - postType
      - createdAt
      description: 'Bản rút gọn cho PENDING: không có seller contact, detail link và các trường nhạy cảm.'
      additionalProperties: false
    PendingFeedPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PendingFeedItem'
        meta:
          $ref: '#/components/schemas/PageMeta'
      required:
      - data
      - meta
      additionalProperties: false
    FeedResponse:
      oneOf:
      - $ref: '#/components/schemas/PostPage'
      - $ref: '#/components/schemas/PendingFeedPage'
      description: APPROVED nhận PostPage; PENDING chỉ nhận PendingFeedPage, không hỗ trợ search/filter.
    CreatePostMultipart:
      type: object
      properties:
        postType:
          $ref: '#/components/schemas/PostType'
        title:
          type: string
          maxLength: 255
        description:
          type: string
        categoryId:
          type: string
        province:
          type: string
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
        condition:
          type: string
        allowPhoneReveal:
          type: boolean
        budgetMin:
          type: number
          minimum: 0
        budgetMax:
          type: number
          minimum: 0
        images:
          type: array
          items:
            type: string
            format: binary
          minItems: 1
