name: Campus Marketplace Monorepo CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.1
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm lint

      - name: Run Typecheck
        run: pnpm typecheck

      # =========================================================================
      # AUTOMATED CI TEST SUITE:
      # - Unit Tests (Backend Jest unit tests with mock database/dependencies)
      # - Frontend Tests (Vitest React component & client envelope integration)
      # - Backend E2E Tests (Supertest HTTP API integration with mocked database)
      #
      # NOTE: Database live integration tests ('pnpm db:test') connect to remote
      # PostgreSQL / Supabase with strict TLS verification (rejectUnauthorized: true)
      # and must ONLY be run manually in authorized environments with credentials.
      # They are explicitly excluded from public/unauthenticated CI runners.
      # =========================================================================
      - name: Run Unit & Frontend Tests
        run: pnpm test

      - name: Run Backend E2E Tests (Mocked / Isolated)
        run: pnpm test:e2e

      - name: Run Build
        run: pnpm build
